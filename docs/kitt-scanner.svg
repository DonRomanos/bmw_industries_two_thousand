<svg xmlns="http://www.w3.org/2000/svg" width="400" height="30" viewBox="0 0 400 30" role="img" aria-label="Animated red scanner light">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3b30" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
    <mask id="segments">
      <g fill="#fff">
        <rect x="8" y="8" width="20" height="14" rx="2"/>
        <rect x="32" y="8" width="20" height="14" rx="2"/>
        <rect x="56" y="8" width="20" height="14" rx="2"/>
        <rect x="80" y="8" width="20" height="14" rx="2"/>
        <rect x="104" y="8" width="20" height="14" rx="2"/>
        <rect x="128" y="8" width="20" height="14" rx="2"/>
        <rect x="152" y="8" width="20" height="14" rx="2"/>
        <rect x="176" y="8" width="20" height="14" rx="2"/>
        <rect x="200" y="8" width="20" height="14" rx="2"/>
        <rect x="224" y="8" width="20" height="14" rx="2"/>
        <rect x="248" y="8" width="20" height="14" rx="2"/>
        <rect x="272" y="8" width="20" height="14" rx="2"/>
        <rect x="296" y="8" width="20" height="14" rx="2"/>
        <rect x="320" y="8" width="20" height="14" rx="2"/>
        <rect x="344" y="8" width="20" height="14" rx="2"/>
        <rect x="368" y="8" width="20" height="14" rx="2"/>
      </g>
    </mask>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="400" height="30" rx="6" fill="#0b0b0b"/>
  <g mask="url(#segments)">
    <rect x="8" y="8" width="380" height="14" fill="#3a0606"/>
    <rect y="0" width="110" height="30" fill="url(#beam)">
      <animate attributeName="x" values="-47;333;-47" keyTimes="0;0.5;1" calcMode="spline"
               keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect y="4" width="110" height="22" fill="url(#beam)" filter="url(#glow)" opacity="0.6">
    <animate attributeName="x" values="-47;333;-47" keyTimes="0;0.5;1" calcMode="spline"
             keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
