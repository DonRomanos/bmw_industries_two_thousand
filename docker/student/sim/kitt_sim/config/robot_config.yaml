# Generated by scripts/export_sim_config.py. Values marked PLACEHOLDER are estimates.
vehicle:
  status: 'BMW i8 ride-on: length, width, height, wheelbase, track_width, wheel_radius, max_steering_angle
    and max_speed are measured; PLACEHOLDER: rear_overhang and ground_clearance are estimates'
  length: 1.27
  width: 0.76
  height: 0.52
  rear_overhang: 0.22
  wheelbase: 0.72
  track_width: 0.55
  wheel_radius: 0.1125
  wheel_width: 0.08
  ground_clearance: 0.1
  max_steering_angle: 0.3
  turning_radius_margin: 1.1
  footprint_padding: 0.0
  footprint_lateral_padding: -0.08
  max_speed: 0.4
  max_reverse_speed: 0.2
  max_accel: 0.5
  max_decel: 1.0
  derived:
    min_turning_radius_m: 2.5603206898625355
    max_yaw_rate_rad_s: 0.1562304290957693
    footprint_with_padding_base_link: '[[-0.22, -0.3], [-0.22, 0.3], [1.05, 0.3], [1.05, -0.3]]'
  not_modelled: mass, inertia, tyre friction, motor/steering dynamics (unknown); all URDF joints are fixed,
    the sim adds steering and drive joints
frames:
  tree:
  - odom (cuVSLAM) -> base_link -> base_footprint, body, 4 wheels
  - base_link -> camera_link -> left_optical -> left_rect_optical
  - left_optical -> right_optical (right_camera_link in the URDF has the same pose)
  - base_link -> back_camera_link -> back_camera_optical
  base_link: centre of the rear axle, x forward, y left, z up; ground is wheel_radius below
  optical_frames: x right, y down, z forward (rpy -pi/2 0 -pi/2 from the x-forward link)
  real_robot_publishes: odom->base_link (cuVSLAM), left_optical->right_optical and left_optical->left_rect_optical
    (camera node, static); the rest comes from the URDF
sensors:
  stereo:
    hardware: 2x IMX219 on a 3D printed plate, parallel, side by side
    resolution:
    - 640
    - 360
    rate_hz: 60
    encoding: mono8
    baseline_m: 0.06009615841407601
    left_mount_on_camera_link: 'camera_link origin (config camera: x, y, z, rpy in vehicle.yaml)'
    left_to_right_optical:
      xyz:
      - 0.060095
      - -0.000343
      - -0.000285
      rpy:
      - 0.002153
      - -0.003603
      - 0.003709
      note: from the stereo calibration (includes the small real misalignment); use xyz=[baseline,0,0],
        rpy=0 for an ideal rig
    left:
      topic: visual_slam/image_0
      camera_info: visual_slam/camera_info_0
      frame_id: left_optical
      fx: 551.84475525
      fy: 550.97006886
      cx: 341.68000214
      cy: 185.4509494
      distortion_model: plumb_bob
      distortion_k1_k2_p1_p2_k3:
      - -0.06667252
      - 0.12261898
      - 0.00125587
      - -0.00412778
      - 0.0
    right:
      topic: visual_slam/image_1
      camera_info: visual_slam/camera_info_1
      frame_id: right_optical
      fx: 548.91070881
      fy: 548.47709055
      cx: 317.4976024
      cy: 183.55093978
      distortion_model: plumb_bob
      distortion_k1_k2_p1_p2_k3:
      - -0.06250386
      - 0.12291333
      - -0.00214733
      - -0.00293466
      - 0.0
    rectified:
      fx: 570.07593487
      cx: 331.9805336
      cy: 184.3735981
      note: ideal pinhole after rectification, what the depth chain works on
    gazebo_sensor: ideal pinhole (no distortion) with hfov from each camera K; the URDF sensors publish
      the topics above, set camera_info from calib/*.yaml
    stamps: left and right share one header stamp (mean capture time); the real pair is matched within
      about 8 ms
    qos: reliable, keep last 4 (rclcpp default); 60 Hz
    depth_chain_inputs: rect_in/{left,right}/camera_info, rect_in/left/image (15 Hz) are created by the
      camera node for the SGM depth chain
  back_camera:
    status: PLACEHOLDER mount pose and FOV (USB webcam, preview only, not used by navigation)
    topic: back_camera/image/compressed (sensor_msgs/CompressedImage, JPEG)
    resolution:
    - 640
    - 480
    rate_hz: 15
    frame_id: back_camera_optical
interfaces:
  command_to_robot:
    topic: /cmd_vel (geometry_msgs/Twist) + /steer_cmd (car_interfaces/SteerCmd)
    cmd_vel.linear.x: m/s, negative = reverse down to -0.2
    steer_cmd.angle_rad: rad, positive left, virtual centre wheel (bicycle model), limited to +-0.3
    rate_hz: 20
    timeout: zero speed for 1 s after the last Nav2 command, then silent
    chain: Nav2 controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed (TwistStamped) -> ackermann_cmd_node
  odometry:
    topic: /visual_slam/tracking/odometry
    type: nav_msgs/Odometry
    rate_hz: 60
    frames: odom -> base_link; Nav2 runs in odom (mapless)
    note: a simulation can publish ground truth under the same topic and TF
  goal: /goal_pose (geometry_msgs/PoseStamped, frame odom)
  obstacles: /nvblox_node/static_map_slice (2D ESDF slice, 15 Hz depth in, 0.05 m voxels)
  clock: real robot uses system time; run all nodes with use_sim_time in the simulation
nav2: see nav2_params.yaml (Smac Hybrid-A* Reeds-Shepp + Regulated Pure Pursuit, MPPI Ackermann selectable,
  behavior tree without spin/back-up recovery)
