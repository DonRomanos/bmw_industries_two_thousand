# Generated by scripts/export_sim_config.py from the real robot parameters.
# Obstacles come from the nvblox_layer (nvblox::nav2::NvbloxCostmapLayer); in a simulation
# without nvblox replace it by an obstacle/voxel layer fed by the simulated depth camera.
behavior_server:
  ros__parameters:
    behavior_plugins:
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      acceleration_limit: 0.5
      deceleration_limit: -1.0
      minimum_speed: 0.1
      plugin: nav2_behaviors::DriveOnHeading
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: odom
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    robot_base_frame: base_link
    simulate_ahead_time: 2.0
    transform_tolerance: 0.1
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_cancel_timeout: 50
    default_nav_to_pose_bt_xml: behavior_trees/navigate_to_pose_forward_only.xml
    default_server_timeout: 20
    error_code_name_prefixes:
    - assisted_teleop
    - backup
    - compute_path
    - dock_robot
    - drive_on_heading
    - follow_path
    - nav_thru_poses
    - nav_to_pose
    - smoother
    - spin
    - undock_robot
    - wait
    filter_duration: 0.3
    global_frame: odom
    introspection_mode: disabled
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: odom
    robot_base_frame: base_link
    wait_for_service_timeout: 1000
controller_server:
  ros__parameters:
    FollowPath:
      Ackermann:
        min_turning_r: 2.5603206898625355
        plugin: mppi::AckermannMotionModel
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: false
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        near_collision_cost: 253
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 1.4
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 6
        threshold_to_consider: 0.5
        trajectory_point_step: 2
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 8.0
        enabled: true
        offset_from_furthest: 3
        threshold_to_consider: 1.4
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 15.0
        enabled: true
        threshold_to_consider: 0.5
      TrajectoryValidator:
        collision_lookahead_time: 2.0
        consider_footprint: true
        plugin: mppi::DefaultOptimalTrajectoryValidator
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      ax_max: 0.5
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.0
      batch_size: 600
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      gamma: 0.015
      iteration_count: 1
      model_dt: 0.1
      motion_model: Ackermann
      open_loop: true
      plugin: nav2_mppi_controller::MPPIController
      publish_optimal_trajectory: false
      regenerate_noises: true
      temperature: 0.3
      time_steps: 50
      visualize: false
      vx_max: 0.4
      vx_min: -0.2
      vx_std: 0.05
      vy_max: 0.0
      vy_std: 0.0
      wz_max: 0.1562304290957693
      wz_std: 0.062
    FollowPathRPP:
      allow_reversing: true
      approach_velocity_scaling_dist: 0.6
      curvature_lookahead_dist: 0.6
      interpolate_curvature_after_goal: false
      lookahead_dist: 1.5
      lookahead_time: 5.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_vel: 0.156
      max_linear_vel: 0.25
      max_lookahead_dist: 2.2
      min_approach_linear_velocity: 0.08
      min_lookahead_dist: 1.2
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 3.07
      regulated_linear_scaling_min_speed: 0.1
      transform_tolerance: 0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: true
    PathHandler:
      enforce_path_inversion: true
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
      reject_unit_path: false
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    - FollowPathRPP
    costmap_update_timeout: 0.3
    failure_tolerance: 0.3
    general_goal_checker:
      path_length_tolerance: 1.0
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.6
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    path_handler_plugins:
    - PathHandler
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
    progress_checker_plugins:
    - progress_checker
    speed_limit_topic: speed_limit
    use_realtime_priority: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.22, -0.3], [-0.22, 0.3], [1.05, 0.3], [1.05, -0.3]]'
      global_frame: odom
      height: 20
      inflation_layer:
        cost_scaling_factor: 4.0
        inflation_radius: 1.19
        plugin: nav2_costmap_2d::InflationLayer
      introspection_mode: disabled
      nvblox_layer:
        convert_to_binary_costmap: true
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        plugin: nvblox::nav2::NvbloxCostmapLayer
      plugins:
      - nvblox_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.1
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: true
      update_frequency: 1.0
      width: 20
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names:
    - controller_server
    - smoother_server
    - planner_server
    - behavior_server
    - bt_navigator
    - velocity_smoother
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.22, -0.3], [-0.22, 0.3], [1.05, 0.3], [1.05, -0.3]]'
      global_frame: odom
      height: 6
      inflation_layer:
        cost_scaling_factor: 6.0
        inflation_radius: 1.19
        plugin: nav2_costmap_2d::InflationLayer
      introspection_mode: disabled
      nvblox_layer:
        convert_to_binary_costmap: true
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        plugin: nvblox::nav2::NvbloxCostmapLayer
      plugins:
      - nvblox_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 5.0
      width: 6
planner_server:
  ros__parameters:
    GridBased:
      allow_primitive_interpolation: false
      allow_unknown: true
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      analytic_expansion_max_length: 3.0
      analytic_expansion_ratio: 3.5
      angle_quantization_bins: 72
      cache_obstacle_heuristic: true
      change_penalty: 2.0
      cost_penalty: 2.0
      debug_visualizations: false
      downsample_costmap: false
      downsample_obstacle_heuristic: true
      downsampling_factor: 1
      lookup_table_size: 20.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      minimum_turning_radius: 2.5603206898625355
      motion_model_for_search: REEDS_SHEPP
      non_straight_penalty: 1.2
      plugin: nav2_smac_planner::SmacPlannerHybrid
      retrospective_penalty: 0.015
      reverse_penalty: 10.0
      smooth_path: true
      smoother:
        max_iterations: 1000
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      terminal_checking_interval: 5000
      tolerance: 0.25
      use_quadratic_cost_penalty: false
    allow_partial_planning: false
    costmap_update_timeout: 1.0
    expected_planner_frequency: 1.0
    introspection_mode: disabled
    planner_plugins:
    - GridBased
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      enforce_path_inversion: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      refinement_num: 2
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -1.0
    - 0.0
    - -1.0
    max_velocity:
    - 0.4
    - 0.0
    - 0.1562304290957693
    min_velocity:
    - -0.2
    - 0.0
    - -0.1562304290957693
    odom_duration: 0.1
    odom_topic: odom
    scale_velocities: false
    smoothing_frequency: 20.0
    velocity_timeout: 1.0
